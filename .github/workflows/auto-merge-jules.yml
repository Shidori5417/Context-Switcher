name: Auto-Merge Google Jules PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    # Sadece google-jules kullanıcısından gelen PR'ları işle
    if: github.event.pull_request.user.login == 'google-jules'
    
    steps:
      # Workflow kendi PR'ını onaylamaz ve --admin ile koruma kurallarını atlamaz.
      # --auto: birleştirme, main üzerindeki koruma kuralları (ör. insan onayı, gerekli
      # kontroller) karşılanınca yapılır. Depo ayarında "Allow auto-merge" açık olmalıdır.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Enabling auto-merge for PR: $PR_URL"
          gh pr merge "$PR_URL" --merge --auto --delete-branch
